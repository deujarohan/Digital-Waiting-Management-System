<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarnia Bank — Join Queue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="entry-box">
        <div class="entry-header">
          <div class="logo">
            <span class="logo-name">Sarnia Bank</span>
          </div>
          <h1>Join the Queue</h1>
          <p>Fill in your details below to get a token number.</p>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="msg-error" th:text="${error}">
          Something went wrong. Please try again.
        </div>

        <!-- Success message -->
        <div th:if="${success}" class="msg-success" th:text="${success}">
          Token issued successfully.
        </div>

        <form th:action="@{/create}" th:object="${token}" method="post">
          <!-- CSRF token (Spring Security) -->
          <!-- <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          /> -->

          <!-- Full Name -->
          <div class="field-group">
            <label for="userName">Full Name</label>
            <input
              type="text"
              id="userName"
              th:field="*{userName}"
              placeholder="John Smith"
              required
            />
            <span
              class="field-error"
              th:if="${#fields.hasErrors('userName')}"
              th:errors="*{userName}"
              >Name error</span
            >
          </div>

          <!-- Phone Number -->
          <div class="field-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+1 234 567 8900"
              required
            />
          </div>

          <!-- Email -->
          <div class="field-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <!-- Service -->
          <div class="field-group">
            <label for="service">Select Service</label>
            <select id="service" th:field="*{service}" required>
              <option value="" disabled selected>-- Choose a service --</option>
              <option value="Advice">Advice</option>
              <option value="Account">Account</option>
              <option value="Cash Deposit">Cash Deposit</option>
              <option value="Problem">Problem</option>
            </select>
            <span
              class="field-error"
              th:if="${#fields.hasErrors('service')}"
              th:errors="*{service}"
              >Service error</span
            >
          </div>

          <button type="submit">Get My Token</button>
        </form>
      </div>
    </div>
  </body>
</html>
